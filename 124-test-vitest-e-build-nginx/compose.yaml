# Development: `docker compose up -d --wait postgres` starts only the database.
# Production build (lesson 124): build the web first (`npx ng build` in web/),
# then `docker compose up -d --build --wait` starts database, API and nginx.
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      # Demo default for local development only: set DB_PASSWORD to override it.
      POSTGRES_PASSWORD: ${DB_PASSWORD:-shop-demo-password}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:21242:5432"
  api:
    build: ./api
    image: shop-api:local
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/shop
      DB_PASSWORD: ${DB_PASSWORD:-shop-demo-password}
    # As in lesson 98: a tiny Java class asks the API for a public page
    # that reads the database.
    healthcheck:
      test: ["CMD", "java", "-cp", "shop-0.0.1-SNAPSHOT.jar", "com.shop.HealthCheck"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      start_interval: 2s
      retries: 3
  web:
    image: nginx:1.30.6-alpine
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web/dist/shop-web/browser:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:21243:80"
