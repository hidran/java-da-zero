server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # The API answers on the same origin as the page: no CORS needed in production.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $http_host;
    }

    # Every other path is a route of the Angular app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
