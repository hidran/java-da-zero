# Keycloak for lesson 82: development mode, realm "shop" imported at startup, published only on 127.0.0.1
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    ports:
      - "127.0.0.1:20821:8080"
    volumes:
      - ./keycloak/shop-realm.json:/opt/keycloak/data/import/shop-realm.json:ro
