<h1 class="text-2xl font-semibold">Catalog</h1>
@if (lastAdded()) {
  <p class="mt-4 text-sm text-green-800" role="status">
    {{ lastAdded() }} added to the cart
  </p>
}
@if (products.hasValue()) {
  <ul
    class="mt-8 grid grid-cols-1 gap-6
      sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"
  >
    @for (product of products.value().content; track product.id) {
      <li>
        <app-product-card [product]="product" (addToCart)="add($event)" />
      </li>
    }
  </ul>
} @else if (products.error()) {
  <p class="mt-8 rounded-md bg-red-50 p-4 text-red-800" role="alert">
    {{ errorMessage() }}
  </p>
} @else {
  <p class="mt-8 text-slate-600">Loading products...</p>
}
