<article
  class="flex h-full flex-col
    rounded-lg border border-slate-200 bg-white p-4
    shadow-sm transition hover:shadow-md"
>
  <p class="text-xs font-semibold tracking-wide text-indigo-700 uppercase">
    {{ product().categoryName }}
  </p>
  <h2 class="mt-1 text-lg font-semibold">{{ product().name }}</h2>
  <p class="mt-2 flex-1 text-sm text-slate-600">{{ product().description }}</p>
  <div class="mt-4 flex items-center justify-between">
    <span class="text-lg font-bold">{{ price() | currency: 'EUR' }}</span>
    <button
      type="button"
      class="rounded-md bg-indigo-600 px-3 py-2
        text-sm font-medium text-white
        hover:bg-indigo-700 focus-visible:outline-2 focus-visible:outline-offset-2"
      (click)="addToCart.emit(product())"
    >
      Add to cart
    </button>
  </div>
</article>
