spring:
  application:
    name: catalog-service
  main:
    banner-mode: off
  mvc:
    problemdetails:
      enabled: true
server:
  address: 127.0.0.1
  port: 21080
management:
  tracing:
    sampling:
      probability: 1.0
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://127.0.0.1:21088/v1/traces
  otlp:
    metrics:
      export:
        enabled: false
logging:
  level:
    root: warn
    com.shop: info
    org.apache.kafka: error
