<header class="border-b border-slate-200 bg-white">
  <nav
    class="mx-auto flex max-w-6xl flex-wrap items-center gap-4 px-4 py-3"
    aria-label="Main"
  >
    <a routerLink="/" class="text-xl font-bold text-indigo-700">Shop</a>
    <span class="flex-1"></span>
    @if (auth.isAdmin()) {
      <a
        routerLink="/admin/products/new"
        class="text-sm font-medium hover:underline"
      >
        New product
      </a>
    }
    <a routerLink="/cart" class="text-sm font-medium hover:underline">
      Cart ({{ cart.count() }})
    </a>
    @if (auth.isLoggedIn()) {
      <span class="text-sm text-slate-600">{{ auth.username() }}</span>
      <button
        type="button"
        class="text-sm font-medium hover:underline"
        (click)="logout()"
      >
        Log out
      </button>
    } @else {
      <a routerLink="/login" class="text-sm font-medium hover:underline">Log in</a>
    }
  </nav>
</header>
<main class="mx-auto max-w-6xl px-4 py-8">
  <router-outlet />
</main>
