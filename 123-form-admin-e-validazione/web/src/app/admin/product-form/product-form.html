<h1 class="text-2xl font-semibold">New product</h1>
<form [formRoot]="productForm" class="mt-6 flex max-w-xl flex-col gap-4">
  <label class="flex flex-col gap-1">
    <span class="font-medium">Name</span>
    <input class="field" [formField]="productForm.name" />
    <app-field-error [state]="productForm.name()" />
  </label>
  <label class="flex flex-col gap-1">
    <span class="font-medium">Description</span>
    <textarea
      class="field"
      rows="3"
      [formField]="productForm.description"
    ></textarea>
    <app-field-error [state]="productForm.description()" />
  </label>
  <label class="flex flex-col gap-1">
    <span class="font-medium">Price in euro</span>
    <input class="field" type="number" step="0.01" [formField]="productForm.price" />
    <app-field-error [state]="productForm.price()" />
  </label>
  <label class="flex flex-col gap-1">
    <span class="font-medium">Category</span>
    <select class="field" [formField]="productForm.categoryId">
      <option value="">Choose a category</option>
      @if (categories.hasValue()) {
        @for (category of categories.value(); track category.id) {
          <option [value]="category.id">{{ category.name }}</option>
        }
      }
    </select>
    <app-field-error [state]="productForm.categoryId()" />
  </label>
  @for (error of productForm().errors(); track $index) {
    <p class="rounded-md bg-red-50 p-3 text-sm text-red-800" role="alert">
      {{ error.message }}
    </p>
  }
  <button
    type="submit"
    class="self-start rounded-md bg-indigo-600 px-4 py-2 font-medium text-white
      hover:bg-indigo-700 disabled:opacity-50"
    [disabled]="productForm().submitting()"
  >
    Save
  </button>
</form>
