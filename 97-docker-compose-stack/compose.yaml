services:
  app:
    build: .
    image: shop:compose
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/shop
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: demo-password
    ports:
      - "127.0.0.1:18127:8080"
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: demo-password
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - shop-data:/var/lib/postgresql
volumes:
  shop-data:
